services:
  # ==========================================================================
  # Qdrant vector database
  # ==========================================================================
  qdrant:
    image: qdrant/qdrant:v1.19.0
    container_name: therapeutic-qdrant
    restart: unless-stopped

    ports:
      - "6333:6333"

    volumes:
      - qdrant_storage:/qdrant/storage

    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - ':> /dev/tcp/127.0.0.1/6333'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ==========================================================================
  # One-time SapBERT model downloader
  #
  # Run manually before the first application start:
  # docker compose run --rm download-models
  # ==========================================================================
  download-models:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: therapeutic-download-models

    volumes:
      - ./models:/app/models

    environment:
      MODELS_DIR: /app/models
      PYTHONUNBUFFERED: "1"

    entrypoint:
      - python
      - scripts/download_models.py

    profiles:
      - tools

  # ==========================================================================
  # Main therapeutic pipeline
  # ==========================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: therapeutic-pipeline
    restart: unless-stopped

    depends_on:
      qdrant:
        condition: service_healthy

    env_file:
      - .env

    environment:
      # Containers communicate using the Compose service name.
      QDRANT_URL: http://qdrant:6333

      # SapBERT is started inside this same application container.
      SAPBERT_BASE_URL: http://localhost:7997/v1

      MODELS_DIR: /app/models
      PYTHONUNBUFFERED: "1"

    ports:
      - "${SERVER_PORT:-8000}:8000"

    volumes:
      - ./models:/app/models
      - ./data:/app/data

    stdin_open: true
    tty: true

    # Use "interactive" instead of "api" to run the CLI loop.
    command: api

  # ==========================================================================
  # Vite dev server with hot-reload (optional, profile: dev)
  #
  #   docker compose --profile dev up --build
  #
  # Serves the UI at http://localhost:5173 and proxies API calls to `app`.
  # The `app` service already serves the built UI at http://localhost:8000, so
  # this is only needed while developing the frontend.
  # ==========================================================================
  frontend-dev:
    image: node:22-slim
    container_name: therapeutic-frontend-dev

    depends_on:
      - app

    working_dir: /app

    environment:
      # vite.config.js proxies the API endpoints to this origin.
      BACKEND_URL: http://app:8000

    # Install deps into an isolated volume, then start Vite bound to all interfaces.
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"

    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

    ports:
      - "5173:5173"

    profiles:
      - dev



volumes:
  qdrant_storage:
  frontend_node_modules:
