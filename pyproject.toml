[project]
name = "refactored-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "openai>=3.8.0",
    "python-dotenv>=1.2.3",
    "qdrant-client>=1.9.1",
    "torch>=2.14.0",
    "transformers>=4.40.0",
    "safetensors",
    "uvicorn>=0.52.4",
    "huggingface_hub>=0.24",
    "httpx",
    "tqdm",
    "sse-starlette>=1.6.5",
    "openpyxl>=3.1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
